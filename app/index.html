<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Processing Download Link</h1>
    <p id="message">Please wait while we redirect you to the download...</p>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const encodedUrl = getQueryParam('download_url');
            const messageElement = document.getElementById('message');

            if (encodedUrl) {
                try {
                    // Decode the URL component
                    const relativeFileUrl = decodeURIComponent(encodedUrl);

                    // IMPORTANT: Construct the *full* URL to the file on the Hugging Face Space.
                    // You need to know the base URL of your Space. Replace
                    // 'YOUR-SPACE-NAME' and 'YOUR-HF-USERNAME' accordingly.
                    // Example: https://your-hf-username-your-space-name.hf.space
                    // Or just use relative path if this page is hosted elsewhere
                    // and the relative path correctly resolves from the Gradio app's perspective.
                    // Since this page is on arintelli.com, we MUST use the full HF space URL.

                    // *** Replace with your ACTUAL Hugging Face Space URL ***
                    const spaceBaseUrl = "https://greendra-stable-diffusion-3-5-large-serverless2.hf.space/";
                    // *******************************************************

                    const fullFileUrl = spaceBaseUrl + relativeFileUrl; // Construct the full URL

                    messageElement.textContent = `Redirecting you to: ${fullFileUrl}`; // Show the user where they are going

                    // Redirect the browser to the actual file URL
                    // The browser will then handle it (e.g., prompt download, display image)
                    window.location.href = fullFileUrl;

                } catch (e) {
                    console.error("Error decoding URL:", e);
                    messageElement.textContent = "Error: Could not process the download link (invalid encoding).";
                    messageElement.classList.add('error');
                }
            } else {
                messageElement.textContent = "Error: No download link provided.";
                messageElement.classList.add('error');
            }
        });
    </script>
</body>
</html>
