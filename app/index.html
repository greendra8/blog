    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const encodedUrl = getQueryParam('download_url');
            const imgElement = document.getElementById('generated-image');
            const statusElement = document.getElementById('status-message');

            if (encodedUrl) {
                try {
                    // Decode the URL component (e.g., /gradio_api/file=...)
                    const relativeFileUrl = decodeURIComponent(encodedUrl);

                    // *** CRITICAL: Replace with your ACTUAL Hugging Face Space URL ***
                    // *** ENSURE IT DOES NOT HAVE A TRAILING SLASH '/' ***
                    const spaceBaseUrl = "https://greendra-stable-diffusion-3-5-large-serverless2.hf.space"; // NO TRAILING SLASH
                    // ****************************************************************

                    // Combine base URL and relative path to get the full image URL
                    // This automatically handles potential double slashes if relativeFileUrl starts with one
                    const fullFileUrl = new URL(relativeFileUrl, spaceBaseUrl).href;

                    console.log("Constructed Image URL:", fullFileUrl); // For debugging

                    // Set the src attribute of the image tag
                    imgElement.src = fullFileUrl;
                    imgElement.alt = "Generated AI Art"; // Update alt text

                    // Update status message on successful load
                    imgElement.onload = () => {
                        statusElement.textContent = "Image loaded successfully!";
                        statusElement.className = 'success'; // Optional: style success message
                        console.log("Image loaded successfully.");
                    };
                    // Update status message on error
                    imgElement.onerror = () => {
                        statusElement.textContent = "Error: Could not load the image from the source.";
                        statusElement.className = 'error';
                        console.error("Error loading image from:", fullFileUrl);
                         // You could display the URL here for debugging if needed
                         // statusElement.textContent += ` URL: ${fullFileUrl}`;
                    };

                } catch (e) {
                    console.error("Error processing URL:", e);
                    statusElement.textContent = "Error: Could not process the download link.";
                    statusElement.className = 'error';
                    imgElement.alt = "Error loading image";
                }
            } else {
                statusElement.textContent = "Error: No download link provided in the URL.";
                statusElement.className = 'error';
                imgElement.alt = "No image link provided";
            }
        });
    </script>
