<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakeAIArt - Download</title>
    <meta name="theme-color" content="#1A1A2E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HD82SX0YYG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-HD82SX0YYG');

        // Track download page view
        gtag('event', 'download_page_view', {
            'event_category': 'navigation'
        });
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3588557831546476"
        crossorigin="anonymous"></script>

    <style>
        /* Modern Mobile App Styling */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #1A1A2E;
            --bg-secondary: #16213E;
            --bg-tertiary: #0F3460;
            --accent: #5D8BF4;
            --accent-light: #80A4FF;
            --accent-dark: #3D5FB0;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-tertiary: #757575;
            --success: #4CAF50;
            --error: #e74c3c;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Global styles */
        h1,
        h2,
        h3 {
            font-weight: 700;
            line-height: 1.3;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--text-primary), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* Header */
        header {
            padding: 1.5rem;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff, var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 42px;
            margin-right: 8px;
            border-radius: 8px;
            border: 3px solid black;
        }

        .highlight {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
        }

        /* Main content */
        main {
            padding: 0;
            max-width: 500px;
            margin: 0 auto;
        }

        .download-section {
            padding: 2rem 1.5rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border: 1px solid rgba(93, 139, 244, 0.1);
            animation: fadeIn 0.5s ease;
        }

        .subtitle {
            display: block;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .instructions {
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--accent);
        }

        .instructions strong {
            color: var(--text-primary);
        }

        /* Image Styling */
        .image-container {
            margin: 1.5rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-tertiary);
            box-shadow: var(--shadow);
        }

        #generated-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            background-color: var(--bg-tertiary);
            transition: opacity 0.3s ease;
        }

        /* Status Message Styling */
        #status-message {
            margin-top: 1rem;
            font-weight: 600;
            font-size: 1rem;
            min-height: 1.6em;
            text-align: center;
            padding: 0.5rem;
            border-radius: var(--radius-sm);
        }

        .loading {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .error {
            color: var(--error);
            background: rgba(231, 76, 60, 0.1);
        }

        .success {
            color: var(--success);
            background: rgba(76, 175, 80, 0.1);
        }

        /* Ad Container Styling */
        .ad-container {
            margin: 1.5rem 0;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 0;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .pulse {
            animation: pulse 1.5s infinite ease-in-out;
        }

        /* Button styling (for potential future use) */
        .btn-primary {
            background: var(--accent);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(93, 139, 244, 0.3);
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 1rem auto;
            text-align: center;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(93, 139, 244, 0.4);
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="https://gan.arinteli.com/img/logo.webp" alt="MakeAIArt Logo">
            <span class="highlight">Make</span>AI<span class="highlight">Art</span>
        </div>
    </header>

    <main>
        <!-- Ad Slot 1: Top of Main Section -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3588557831546476"
                data-ad-slot="2423435744" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <div class="download-section">
            <h1>Your AI Image</h1>
            <span class="subtitle">Ready to Save</span>

            <div class="instructions">
                <p><strong>Long press the image below and select 'Save Image' or 'Download Image'</strong></p>
            </div>

            <p id="status-message" class="loading">Loading your masterpiece...</p>

            <div class="image-container">
                <img id="generated-image" class="pulse" src="" alt="Generated AI Art - Loading...">
            </div>

        </div>

        <!-- Ad Slot 2: Bottom of Page -->
        <div class="ad-container">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-3588557831546476"
                data-ad-slot="2423435744" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </main>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const encodedUrl = getQueryParam('download_url');
            const spaceName = getQueryParam('space_name') || "greendra-stable-diffusion-3-5-large-serverless"; // Fallback for backwards compatibility
            const imgElement = document.getElementById('generated-image');
            const statusElement = document.getElementById('status-message');

            // Try to fill any unfilled ad slots
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {
                console.error("AdSense push error:", e);
            }

            if (encodedUrl) {
                try {
                    // Decode the URL component (e.g., /gradio_api/file=...)
                    const relativeFileUrl = decodeURIComponent(encodedUrl);

                    // Use the space_name parameter from URL to construct the base URL
                    const spaceBaseUrl = `https://${spaceName}.hf.space`;
                    console.log(`Using space URL: ${spaceBaseUrl}`);

                    // Combine base URL and relative path to get the full image URL
                    const fullFileUrl = new URL(relativeFileUrl, spaceBaseUrl).href;

                    console.log("Constructed Image URL:", fullFileUrl);
                    gtag('event', 'image_download_started', {
                        'event_category': 'download',
                        'event_label': 'url_present',
                        'space_name': spaceName // Track which space is being used
                    });

                    // Set the src attribute of the image tag
                    imgElement.src = fullFileUrl;
                    imgElement.alt = "Generated AI Art";

                    // Update status message on successful load
                    imgElement.onload = () => {
                        statusElement.textContent = "Image loaded successfully! Save it now.";
                        statusElement.className = 'success';
                        imgElement.classList.remove('pulse');
                        console.log("Image loaded successfully.");
                        gtag('event', 'image_load_success', {
                            'event_category': 'download',
                            'event_label': 'image_loaded',
                            'space_name': spaceName
                        });
                    };

                    // Update status message on error
                    imgElement.onerror = () => {
                        statusElement.textContent = "Error: Could not load your image. Please try again.";
                        statusElement.className = 'error';
                        imgElement.classList.remove('pulse');
                        imgElement.alt = "Error loading image";
                        console.error("Error loading image from:", fullFileUrl);
                        gtag('event', 'image_load_error', {
                            'event_category': 'download',
                            'event_label': 'load_failed',
                            'space_name': spaceName
                        });
                    };

                } catch (e) {
                    console.error("Error processing URL:", e);
                    statusElement.textContent = "Error: Could not process the download link.";
                    statusElement.className = 'error';
                    imgElement.classList.remove('pulse');
                    imgElement.alt = "Error loading image";
                    gtag('event', 'url_processing_error', {
                        'event_category': 'download',
                        'event_label': 'processing_error'
                    });
                }
            } else {
                statusElement.textContent = "Error: No image link provided.";
                statusElement.className = 'error';
                imgElement.classList.remove('pulse');
                imgElement.alt = "No image link provided";
                gtag('event', 'download_error', {
                    'event_category': 'download',
                    'event_label': 'missing_url'
                });
            }
        });
    </script>
</body>

</html>
